name: macOS DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build macOS app and DMG
        run: sh macos/build-dmg.sh
      - name: Inspect bundle and disk image
        run: |
          plutil -lint dist/Hamzaban.app/Contents/Info.plist
          lipo -archs dist/Hamzaban.app/Contents/MacOS/Hamzaban
          lipo dist/Hamzaban.app/Contents/MacOS/Hamzaban -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 dist/Hamzaban.app
          hdiutil verify dist/Hamzaban-*-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamzaban-macos-dmg
          path: dist/Hamzaban-*-macOS.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hamzaban-macos-dmg
      - name: Publish DMG in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          asset=(Hamzaban-*-macOS.dmg)
          version="${asset[0]#Hamzaban-}"
          version="${version%-macOS.dmg}"
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag and bundle version differ" >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              gh release upload "${tag}" "${asset[0]}" --clobber
            else
              echo "Release ${tag} already exists"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            gh release create "${tag}" "${asset[0]}" --verify-tag --generate-notes
          else
            gh release create "${tag}" "${asset[0]}" --target "${GITHUB_SHA}" --generate-notes
          fi
